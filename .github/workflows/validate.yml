name: Validate

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Install validation tools
        run: pacman -Syu --noconfirm git jq diffutils shellcheck qt6-declarative quickshell

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Trust container checkout
        # Tests deliberately replace HOME with sandboxes, so the exception
        # must not live in a HOME-scoped global config that then disappears.
        run: git config --system --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check shell syntax
        shell: bash
        run: |
          find . -path ./.git -prune -o -type f -name '*.sh' -print0 | xargs -0 -r bash -n
          if [[ -f bootstrap.sh ]]; then
            sh -n bootstrap.sh
          fi

      - name: Run ShellCheck
        run: find . -path ./.git -prune -o -type f -name '*.sh' -print0 | xargs -0 -r shellcheck -x

      - name: Run smoke tests
        shell: bash
        run: |
          for test_script in tests/*.sh; do
            "$test_script"
          done

      - name: Check QML
        shell: bash
        run: |
          mapfile -d '' qml_files < <(find defaults/quickshell -type f -name '*.qml' -print0)
          if ! /usr/lib/qt6/bin/qmllint "${qml_files[@]}" >/tmp/qmllint.log 2>&1; then
            cat /tmp/qmllint.log
            exit 1
          fi
