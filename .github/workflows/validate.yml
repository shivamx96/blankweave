name: Validate

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Install validation tools
        run: pacman -Syu --noconfirm git shellcheck qt6-declarative quickshell

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check shell syntax
        shell: bash
        run: |
          find . -path ./.git -prune -o -type f -name '*.sh' -print0 | xargs -0 -r bash -n
          if [[ -f bootstrap.sh ]]; then
            sh -n bootstrap.sh
          fi

      - name: Run ShellCheck
        run: find . -path ./.git -prune -o -type f -name '*.sh' -print0 | xargs -0 -r shellcheck -x

      - name: Run CLI smoke tests
        run: tests/smoke.sh

      - name: Check QML
        shell: bash
        run: |
          mapfile -d '' qml_files < <(find defaults/quickshell -type f -name '*.qml' -print0)
          if ! /usr/lib/qt6/bin/qmllint "${qml_files[@]}" >/tmp/qmllint.log 2>&1; then
            cat /tmp/qmllint.log
            exit 1
          fi
