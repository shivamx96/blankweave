# Managed by Blankweave; replace the symlink with your own file to override.
# This file shadows /etc/spotify-launcher.conf entirely, so keep it complete.
[spotify]
# Spotify is a CEF application that starts under XWayland unless told
# otherwise. With XWayland left unscaled, Wayland mode keeps it both sharp
# and correctly scaled.
extra_arguments = ["--enable-features=UseOzonePlatform", "--ozone-platform=wayland"]
