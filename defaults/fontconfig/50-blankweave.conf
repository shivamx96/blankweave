<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Normalize toolkit aliases before strong generic preferences, so the system's
     implicit sans-serif fallback cannot win for ui-serif or ui-monospace.
     Explicit application typefaces remain untouched. -->
<fontconfig>
  <match target="pattern">
    <test name="family" qual="any">
      <string>system-ui</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>sans-serif</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>ui-sans-serif</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>sans-serif</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>ui-serif</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>serif</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>ui-monospace</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>monospace</string>
    </edit>
  </match>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer>
      <family>Atkinson Hyperlegible Next</family>
      <family>Noto Sans</family>
      <family>Noto Sans CJK JP</family>
      <family>Noto Color Emoji</family>
      <family>JetBrainsMono Nerd Font</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Noto Serif CJK JP</family>
      <family>Noto Color Emoji</family>
      <family>JetBrainsMono Nerd Font</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer>
      <family>JetBrains Mono</family>
      <family>Noto Sans Mono</family>
      <family>Noto Sans Mono CJK JP</family>
      <family>Noto Color Emoji</family>
      <family>JetBrainsMono Nerd Font</family>
    </prefer>
  </alias>
</fontconfig>
