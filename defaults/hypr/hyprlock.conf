# HyprArch lock screen. The wallpaper remains one continuous canvas; hierarchy
# comes from typography, fine rules, and a compact vertical authentication flow.

source = $HOME/.local/share/hyprarch/hypr/hyprlock-theme.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = $HOME/.cache/hyprarch-current-wallpaper
    color = $lock_canvas

    blur_passes = 3
    blur_size = 8
    noise = 0.006
    contrast = $background_contrast
    brightness = $background_brightness
    vibrancy = $background_vibrancy
    vibrancy_darkness = 0.0
}

# A uniform wash improves legibility without dividing the wallpaper into zones.
shape {
    monitor =
    size = 100%, 100%
    color = $canvas_scrim
    rounding = 0
    position = 0, 0
    halign = center
    valign = center
    zindex = 1
}

# Quiet masthead: useful context pushed to the perimeter of the composition.
label {
    monitor =
    text = HYPRARCH  /  SESSION LOCKED
    color = $accent_bright
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 34, -30
    halign = left
    valign = top
    zindex = 3
}

label {
    monitor =
    text = cmd[update:60000] date "+%A  /  %d %B %Y"
    color = $text_muted
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = -34, -30
    halign = right
    valign = top
    zindex = 3
}

# Time is the visual anchor, centered on the uninterrupted canvas.
label {
    monitor =
    text = cmd[update:1000] date "+%H:%M"
    color = $text
    font_size = 120
    font_family = Atkinson Hyperlegible
    position = 0, 15%
    halign = center
    valign = center
    zindex = 3
}

label {
    monitor =
    text = cmd[update:1000] date "+%S"
    color = $accent_bright
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 14.3%, 18.2%
    halign = center
    valign = center
    zindex = 3
}

# Unequal line segments replace the former split and retain the technical rhythm.
shape {
    monitor =
    size = 38%, 1
    color = $hairline
    rounding = 0
    position = 0, 6.1%
    halign = center
    valign = center
    zindex = 3
}

shape {
    monitor =
    size = 104, 3
    color = $accent_bright
    rounding = 0
    position = -14.8%, 6.1%
    halign = center
    valign = center
    zindex = 4
}

label {
    monitor =
    text = Welcome back, $USER
    color = $text
    font_size = 22
    font_family = Atkinson Hyperlegible
    position = 0, 0.2%
    halign = center
    valign = center
    zindex = 3
}

label {
    monitor =
    text = Enter your password to continue
    color = $text_muted
    font_size = 13
    font_family = Atkinson Hyperlegible
    position = 0, -3.4%
    halign = center
    valign = center
    zindex = 3
}

# The input is the only surface on screen: focused, wide, and mechanically crisp.
input-field {
    monitor =
    size = 430, 54
    outline_thickness = 1
    dots_size = 0.18
    dots_spacing = 0.30
    dots_center = true
    dots_rounding = 0
    outer_color = $input_border
    inner_color = $input_surface
    font_color = $text
    font_family = Atkinson Hyperlegible
    fade_on_empty = false
    placeholder_text = $placeholder
    rounding = 0
    check_color = $success
    fail_color = $critical
    fail_text = Incorrect password — attempt $ATTEMPTS
    capslock_color = $warning
    numlock_color = $warning
    position = 0, -9.5%
    halign = center
    valign = center
    zindex = 4
}

label {
    monitor =
    text = 󰌾   ENTER TO UNLOCK
    color = $text_muted
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = 0, -14.6%
    halign = center
    valign = center
    zindex = 3
}

# A second rule closes the composition without enclosing it in a card.
shape {
    monitor =
    size = 18%, 1
    color = $hairline
    rounding = 0
    position = 0, -19.2%
    halign = center
    valign = center
    zindex = 3
}

shape {
    monitor =
    size = 36, 2
    color = $accent_bright
    rounding = 0
    position = 0, -19.2%
    halign = center
    valign = center
    zindex = 4
}

label {
    monitor =
    text = cmd[update:60000] echo "$(hostname | tr '[:lower:]' '[:upper:]')  /  LOCAL SESSION"
    color = $text_muted
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = 34, 30
    halign = left
    valign = bottom
    zindex = 3
}

label {
    monitor =
    text = 󰌾  SECURE
    color = $text_muted
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = -34, 30
    halign = right
    valign = bottom
    zindex = 3
}
