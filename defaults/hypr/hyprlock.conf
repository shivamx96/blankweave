# Blankweave lock screen. A restrained glass panel carries the authentication
# hierarchy while the lightly softened wallpaper remains the main canvas.

source = $HOME/.local/share/blankweave/hypr/hyprlock-theme.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

# SDDM auto-login never sees a password, so this lock screen is where the
# keyring gets unlocked. The installer writes the PAM service.
auth {
    pam {
        module = blankweave-lock
    }
}

background {
    monitor =
    path = $HOME/.cache/blankweave-current-wallpaper
    color = $lock_canvas

    blur_passes = 1
    blur_size = 3
    noise = 0.001
    contrast = $background_contrast
    brightness = $background_brightness
    vibrancy = $background_vibrancy
    vibrancy_darkness = 0.0
}

# The only overlay on the wallpaper: one compact, translucent center panel.
shape {
    monitor =
    size = 600, 600
    color = $panel_surface
    border_size = 1
    border_color = $panel_border
    rounding = 6
    shadow_passes = 3
    shadow_size = 12
    shadow_color = $panel_shadow
    position = 0, 0
    halign = center
    valign = center
    zindex = 2
}

# Keep useful context within the central composition, leaving the wallpaper's
# edges uninterrupted.
label {
    monitor =
    text = cmd[update:60000] date "+%A  /  %d %B %Y"
    color = $text_muted
    font_size = 14
    font_family = Atkinson Hyperlegible
    shadow_passes = 2
    shadow_size = 3
    shadow_color = $text_shadow
    position = 0, 90
    halign = center
    valign = center
    zindex = 3
}

# Time is the visual anchor, with the date directly beneath it.
label {
    monitor =
    text = cmd[update:1000] date "+%H:%M"
    color = $text
    font_size = 120
    font_family = Atkinson Hyperlegible
    shadow_passes = 2
    shadow_size = 4
    shadow_color = $text_shadow
    position = 0, 172
    halign = center
    valign = center
    zindex = 3
}

# Unequal line segments replace the former split and retain the technical rhythm.
shape {
    monitor =
    size = 430, 1
    color = $hairline
    rounding = 0
    position = 0, 52
    halign = center
    valign = center
    zindex = 3
}

shape {
    monitor =
    size = 104, 3
    color = $accent_bright
    rounding = 0
    position = -163, 52
    halign = center
    valign = center
    zindex = 4
}

label {
    monitor =
    text = Welcome back, $USER
    color = $text
    font_size = 22
    font_family = Atkinson Hyperlegible
    shadow_passes = 2
    shadow_size = 3
    shadow_color = $text_shadow
    position = 0, 0
    halign = center
    valign = center
    zindex = 3
}

# The input remains focused, wide, and mechanically crisp.
input-field {
    monitor =
    size = 430, 54
    outline_thickness = 1
    dots_size = 0.18
    dots_spacing = 0.30
    dots_center = true
    dots_rounding = 0
    outer_color = $input_border
    inner_color = $input_surface
    font_color = $text
    font_family = Atkinson Hyperlegible
    fade_on_empty = false
    placeholder_text = $placeholder
    rounding = 0
    check_color = $success
    fail_color = $critical
    fail_text = Incorrect password — attempt $ATTEMPTS
    capslock_color = $warning
    numlock_color = $warning
    position = 0, -82
    halign = center
    valign = center
    zindex = 4
}

label {
    monitor =
    text = 󰌾   ENTER TO UNLOCK
    color = $text_muted
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = 0, -142
    halign = center
    valign = center
    zindex = 3
}

# A second rule closes the composition without enclosing it in a card.
shape {
    monitor =
    size = 220, 1
    color = $hairline
    rounding = 0
    position = 0, -230
    halign = center
    valign = center
    zindex = 3
}

shape {
    monitor =
    size = 36, 2
    color = $accent_bright
    rounding = 0
    position = 0, -230
    halign = center
    valign = center
    zindex = 4
}
